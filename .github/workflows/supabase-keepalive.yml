# Evita que Supabase pause el proyecto por inactividad (plan gratuito: ~7 días sin uso).
# Hace una consulta de solo lectura cada 3 días. Si falla (proyecto ya pausado o caído),
# el job termina en error y GitHub avisa por email al propietario del repositorio.
#
# Nota: GitHub desactiva los workflows programados de repos públicos tras 60 días sin
# actividad en el repo; avisa por email y se reactiva con un clic en la pestaña Actions.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consulta ligera a Supabase
        run: |
          # URL y clave anónima (pública por diseño) se leen de app.js para no duplicarlas.
          URL=$(grep -oE "SUPABASE_URL *= *'[^']+'" app.js | sed -E "s/.*'([^']+)'/\1/")
          KEY=$(grep -oE "SUPABASE_ANON_KEY *= *'[^']+'" app.js | sed -E "s/.*'([^']+)'/\1/")
          test -n "$URL" && test -n "$KEY" || { echo "No se encontraron URL/clave en app.js"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            "$URL/rest/v1/manuales?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase respondió HTTP $code"
          test "$code" = "200"
